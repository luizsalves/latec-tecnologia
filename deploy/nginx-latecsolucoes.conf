server {
    listen 80;
    listen [::]:80;
    server_name latecsolucoes.com.br www.latecsolucoes.com.br;

    root /var/www/latecsolucoes;
    index index.html;

    access_log /var/log/nginx/latecsolucoes.access.log;
    error_log  /var/log/nginx/latecsolucoes.error.log;

    location ~ /\.git { deny all; return 404; }
    location ~ ^/deploy/ { deny all; return 404; }

    location ~* \.(jpg|jpeg|png|gif|svg|webp|ico|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
